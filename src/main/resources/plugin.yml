name: UltimateMeteorSMP-Orders
main: com.meteorsmp.ultimatemeteorsmp.UltimateMeteorSMP
version: '1.1'
api-version: '1.21'
description: Java replica of orders.sk for Paper 1.21.11
commands:
  ah:
    description: Open auction house
    aliases: [auctionhouse, auction]
  announce:
    description: Send a title announcement to all players
    permission: server.announce
    aliases: [broadcast, bc]
  orders:
    description: Open the order menu
    usage: /orders [debug]
    permission: meteorsmp.use
  ordershelp:
    description: Show the order help menu
    usage: /ordershelp
    permission: meteorsmp.admin
  addmoney:
    description: Add money to a player's balance
    permission: ultimatemeteorsmp.admin
    usage: /addmoney <player> <amount>
  removemoney:
    description: Remove money from a player's balance
    permission: ultimatemeteorsmp.admin
    usage: /removemoney <player> <amount>
permissions:
  meteorsmp.admin:
    description: Admin access to debug order commands
    default: op
  meteorsmp.use:
    description: Allows access to the orders command
    default: true
  ultimatemeteorsmp.admin:
    description: Admin access for economy commands
    default: op
  server.announce:
    description: Allows sending server announcements
    default: op
