# ==============================================================================
# UltimateMeteorSMP - Main Configuration
# ==============================================================================
# This config file is shared by the Java plugin and the bundled Auction House addon.
# It supports both the existing Orders system and the ah.sk auction system.

# --- Global plugin toggles ---
SETTINGS:
  ENABLED: true
  ORDER_DURATION_HOURS: 168
  MAX_ACTIVE_ORDERS_DEFAULT: 5
  MAX_ACTIVE_ORDERS_BY_PERMISSION:
    ultimatedonutsmp.orders.limit.10: 10
    ultimatedonutsmp.orders.limit.15: 15
  MAX_QUANTITY_PER_ORDER: 2304
  CLICK_COOLDOWN_MS: 750
  EXPIRE_CHECK_SECONDS: 30

# --- Economy settings for money and balance actions ---
ECONOMY:
  method: "variable"
  # These are the exact command templates used by the Auction House script.
  # Example valid values:
  #   give-money: "add-to-balance {player} {amount}"
  #   remove-money: "removemoney {player} {amount}"
  #   give-money: "eco give {player} {amount}"
  #   remove-money: "eco take {player} {amount}"
  give-command: "addmoney %player% %amount%"
  remove-command: "removemoney %player% %amount%"
  balance-variable: "{balance::%player%}"
  require-funds-check: true

# --- Pricing and order limits ---
PRICING:
  MIN_PRICE_EACH: 10
  MAX_PRICE_EACH: 1000000
  MAX_TOTAL_BUDGET: 250000000
  ORDER_CREATION_FEE: 0

# --- Delivery system ---
DELIVERY:
  MAX_DELIVER_PER_CLICK: 64
  MODE: DEPOSIT_GUI
  MAX_DELIVER_PER_TRANSACTION: 2304

# --- Item matching filters ---
MATCHING:
  BLOCKED_MATERIALS:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - LIGHT

CATEGORY_FILTERS:
  ALL: []
  BLOCKS:
    - STONE
    - COBBLESTONE
    - DIRT
    - OAK_LOG
    - GLASS
    - OBSIDIAN
  TOOLS:
    - IRON_PICKAXE
    - DIAMOND_PICKAXE
    - DIAMOND_AXE
    - DIAMOND_SHOVEL
  FOOD:
    - APPLE
    - BREAD
    - COOKED_BEEF
    - COOKED_CHICKEN
    - GOLDEN_CARROT
  COMBAT:
    - ARROW
    - SHIELD
    - DIAMOND_SWORD
    - NETHERITE_SWORD
  POTIONS:
    - GLASS_BOTTLE
    - FERMENTED_SPIDER_EYE
    - BLAZE_POWDER
  BOOKS:
    - BOOK
    - BOOKSHELF
    - LECTERN
  INGREDIENTS:
    - WHEAT
    - SUGAR_CANE
    - BLAZE_ROD
    - ENDER_PEARL
    - SLIME_BALL
  UTILITIES:
    - HOPPER
    - PISTON
    - OBSERVER
    - REDSTONE
    - DISPENSER

# --- GUI and UI settings ---
GUI:
  MAIN:
    TITLE: '&8Orders'
    SIZE: 54
    ITEMS_PER_PAGE: 45
  MY_ORDERS:
    TITLE: '&8ᴏʀᴅᴇʀѕ -> ᴍʏ ᴏʀᴅᴇʀѕ'
    SIZE: 27
    ITEMS_PER_PAGE: 45
    BUTTONS:
      NEW:
        SLOT: 26
  NEW_ORDER:
    TITLE: '&8ᴏʀᴅᴇʀѕ -> ɴᴇᴡ ᴏʀᴅᴇʀ'
    SIZE: 27
  SELECT_ITEM:
    TITLE: '&8ᴏʀᴅᴇʀѕ -> ѕᴇʟᴇᴄᴛ ɪᴛᴇᴍ'
    SIZE: 54
    ITEMS_PER_PAGE: 45
  EDIT_ORDER:
    TITLE: '&8ᴏʀᴅᴇʀѕ -> ᴇᴅɪᴛ ᴏʀᴅᴇʀ'
    SIZE: 27
    BUTTONS:
      DROP:
        SLOT: 24
  DELIVER_CONFIRM:
    TITLE: '&8ᴏʀᴅᴇʀѕ -> ᴅᴇʟɪᴠᴇʀ'
    SIZE: 27
  COLLECT:
    TITLE: '&8ᴏʀᴅᴇʀѕ -> ᴄᴏʟʟᴇᴄᴛ'
    SIZE: 54
    ITEMS_PER_PAGE: 45
    BUTTONS:
      COLLECT_PAGE:
        SLOT: 49
      DROP_PAGE:
        SLOT: 53
  DELIVERY_DEPOSIT:
    BUTTONS:
      CONFIRM:
        SLOT: 35

SORTING:
  DEFAULT: MOST_PAID
  ALLOWED:
    - MOST_PAID
    - MOST_DELIVERED
    - RECENTLY_LISTED
    - MOST_MONEY_PER_ITEM

DONUT-STYLE: DEPOSIT_GUI

BEDROCK:
  ENABLED: true

SEARCH_SIGN:
  lines:
    - ""
    - "^^^^^^^^^^^^^^"
    - "Search"
    - ""
  input-line: 0

AMOUNT_SIGN:
  lines:
    - ""
    - "^^^^^^^^^^^^^^"
    - "Amount"
    - ""
  input-line: 0

PRICE_SIGN:
  lines:
    - ""
    - "^^^^^^^^^^^^^^"
    - "Price"
    - ""
  input-line: 0

BOTS:
  ENABLED: false
  MIN_CHECK_INTERVAL_SECONDS: 60
  MAX_CHECK_INTERVAL_SECONDS: 300
  CHANCE: 0.5
  MAX_ACTIVE_BOT_ORDERS: 10
  MIN_DURATION_HOURS: 24
  MAX_DURATION_HOURS: 72
  BOT_NAMES:
    - "OrderBot"
    - "BuyerBot"
    - "ItemCollector"
  ITEMS:
    - MATERIAL: DIAMOND
      MIN_AMOUNT: 16
      MAX_AMOUNT: 64
      MIN_PRICE_EACH: 500
      MAX_PRICE_EACH: 1000
    - MATERIAL: OAK_LOG
      MIN_AMOUNT: 64
      MAX_AMOUNT: 512
      MIN_PRICE_EACH: 10
      MAX_PRICE_EACH: 25
    - MATERIAL: NETHERITE_INGOT
      MIN_AMOUNT: 1
      MAX_AMOUNT: 4
      MIN_PRICE_EACH: 25000
      MAX_PRICE_EACH: 50000

# ==============================================================================
# Auction House (ah.sk) settings
# ==============================================================================
auction-house:
  enabled: true
  trans-cap: 100
  max-listing-hours: 24
  default-sort: "high_to_low"
  default-view: "active"
  allow-search: true
  notify-on-list: true
  notify-on-purchase: true
  require-confirmation: true
  economy:
    method: "variable"
    give-money: "add-to-balance {player} {amount}"
    remove-money: "removemoney {player} {amount}"
    balance-variable: "{balance::%player%}"
    min-price: 1
    max-price: 1000000000000000000
  messages:
    prefix: "&a[&eᴀᴄᴄᴛɪᴏɴ ʜᴏᴄᴄ&a]"
    invalid-price: "&c[&eᴀᴄᴄᴛɪᴏɴ ʜᴏᴄᴄ&c] &7Invalid price format! Use numbers with suffixes (10k, 5m, 20b)."
    item-must-be-held: "&c[&eᴀᴄᴄᴛɪᴏɴ ʜᴏᴄᴄ&c] &7You must hold an item to sell!"
    not-enough-money: "&c[&eᴀᴄᴄᴛɪᴏɴ ʜᴏᴄᴄ&c] &7You do not have enough money!"
  ui:
    rows: 6
    search-slot: 50
    refresh-slot: 49
    sort-slot: 47
    your-items-slot: 51
    next-page-slot: 53
    previous-page-slot: 45
    pane-name: "&7"
    sounds:
      list: "entity.item.pickup"
      purchase: "entity.player.levelup"
      volume: 0.5
      pitch: 1.5
